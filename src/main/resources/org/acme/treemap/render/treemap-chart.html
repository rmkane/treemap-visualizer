<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@@TITLE_XML@@</title>
  <style>
    body { margin: 0; background: #1a1d23; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { color: #eee; margin: 12px 24px 8px; font-size: 18px; font-weight: 600; }
    .wrap { padding: 0 0 24px; }
    svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
    svg rect.cell {
      stroke: rgba(0,0,0,0.35);
      stroke-width: 1;
      cursor: default;
      vector-effect: non-scaling-stroke;
      shape-rendering: crispEdges;
      transition: filter 0.14s ease, stroke 0.14s ease, stroke-width 0.14s ease;
    }
    svg .cell-group.hovered rect.cell {
      filter: brightness(1.2) saturate(1.12) drop-shadow(0 0 6px rgba(255,220,120,0.45));
      stroke: rgba(255, 214, 102, 0.98);
      stroke-width: 3;
    }
    svg .cell-group.parent-hovered rect.cell {
      filter: brightness(1.1) saturate(1.05);
      stroke: rgba(139, 184, 255, 0.95);
      stroke-width: 2;
    }
    svg .cell-group.muted rect.cell {
      opacity: 0.2;
      filter: saturate(0.7) brightness(0.85);
      stroke: rgba(0, 0, 0, 0.2);
      stroke-width: 1;
    }
    svg .cell-group.muted text.label-light { opacity: 0.34; }
    svg .cell-group.muted text.label-dark { opacity: 1; }
    svg text { pointer-events: none; user-select: none; }
    #tip {
      position: fixed; display: none; pointer-events: none; z-index: 100;
      background: rgba(17, 20, 26, 0.96);
      color: #e8eaed;
      border: 1px solid rgba(126, 141, 194, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.4;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.42);
      backdrop-filter: blur(2px);
    }
    #tip .lbl { font-weight: 650; margin: 0 0 7px; font-size: 13px; color: #f2f4f8; }
    #tip .row { display: grid; grid-template-columns: 68px 1fr; column-gap: 8px; margin: 4px 0; align-items: start; }
    #tip .k { color: #9fb0c9; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; font-size: 10px; }
    #tip .v { color: #d9e1ee; word-break: break-word; }
    #tip .v.coord { font-family: ui-monospace, monospace; color: #b9c8de; font-size: 11px; word-break: break-all; }
    #tip .sep { height: 1px; margin: 7px 0 5px; background: rgba(176, 190, 216, 0.2); }
  </style>
</head>
<body>
  <h1>@@TITLE_XML@@</h1>
  <div class="wrap">
    <div id="tip"></div>
    <svg xmlns="http://www.w3.org/2000/svg" width="@@CANVAS_WIDTH@@" height="@@CANVAS_HEIGHT@@" viewBox="0 0 @@CANVAS_WIDTH@@ @@CANVAS_HEIGHT@@" role="img" aria-label="Dependency treemap">
    <rect x="0" y="0" width="@@CANVAS_WIDTH@@" height="@@CANVAS_HEIGHT@@" fill="#1a1d23" aria-hidden="true"/>
@@SVG_BODY@@
    </svg>
  </div>
  <script>
  (function () {
    const tip = document.getElementById('tip');
    const svg = document.querySelector('svg');
    const groups = Array.from(svg.querySelectorAll('g.cell-group'));
    function clearHighlight() {
      groups.forEach(function (el) {
        el.classList.remove('hovered');
        el.classList.remove('parent-hovered');
        el.classList.remove('muted');
      });
    }
    function setHighlight(group) {
      clearHighlight();
      if (!group) return;
      group.classList.add('hovered');
      const parentCoord = group.getAttribute('data-parent-coord');
      const active = new Set([group]);
      groups.forEach(function (el) {
        if (el === group) return;
        if (parentCoord && el.getAttribute('data-parent-coord') === parentCoord) {
          el.classList.add('parent-hovered');
          active.add(el);
        }
      });
      groups.forEach(function (el) {
        if (!active.has(el)) el.classList.add('muted');
      });
    }
    function positionTip(e) {
      if (tip.style.display !== 'block') return;
      const x = e.clientX + 14, y = e.clientY + 14;
      tip.style.left = Math.min(x, innerWidth - tip.offsetWidth - 8) + 'px';
      tip.style.top = Math.min(y, innerHeight - tip.offsetHeight - 8) + 'px';
    }
    svg.addEventListener('mousemove', function (e) {
      const g = e.target && e.target.closest && e.target.closest('g.cell-group');
      setHighlight(g);
      if (g) {
        tip.style.display = 'block';
        tip.innerHTML = g.getAttribute('data-html-tip') || '';
        positionTip(e);
      } else {
        tip.style.display = 'none';
      }
    });
    svg.addEventListener('mouseleave', function () {
      clearHighlight();
      tip.style.display = 'none';
    });
  })();
  </script>
</body>
</html>
